<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Berk'in Web Sitesi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #0f172a;
            color: white;
        }

        header {
            background: #020617;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            background: #020617;
            padding: 10px;
        }

        nav a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: white;
        }

        .container {
            padding: 40px;
            text-align: center;
        }

        button {
            padding: 15px 30px;
            font-size: 16px;
            background: #38bdf8;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            background: #0ea5e9;
        }

        footer {
            background: #020617;
            padding: 15px;
            text-align: center;
            position: fixed;
            bottom: 0;
            width: 100%;
            font-size: 14px;
        }
    </style>
</head>
<body>

<header>
    BerkTech Web Site
</header>

<nav>
    <a href="#">Anasayfa</a>
    <a href="#">Hakkımda</a>
    <a href="#">Projeler</a>
    <a href="#">İletişim</a>
</nav>

<div class="container">
    <h1>Hoş Geldin 👋</h1>
    <p>Bu site Berk tarafından yapıldı.</p>
    <button onclick="alert('Buton çalışıyor 🚀')">Tıkla</button>
</div>

<footer>
    © 2025 BerkTech
</footer>

</body>
</html>
